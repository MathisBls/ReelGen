version: '3.9'
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: reelgen
      POSTGRES_USER: reelgen
      POSTGRES_PASSWORD: reelgen
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]

  redis:
    image: redis:7
    ports: ["6379:6379"]

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio123
    ports: ["9000:9000", "9001:9001"]
    volumes: ["minio:/data"]

  api:
    build: ./services/api
    environment:
      DATABASE_URL: postgresql+psycopg://reelgen:reelgen@db:5432/reelgen
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: reelgen
      S3_ACCESS_KEY: minio
      S3_SECRET_KEY: minio123
    depends_on: [db, redis, minio]
    ports: ["8000:8000"]

  worker:
    build: ./services/worker
    environment:
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: reelgen
      S3_ACCESS_KEY: minio
      S3_SECRET_KEY: minio123
    depends_on: [redis, minio]

  web:
    build: ./apps/web
    ports: ["3000:3000"]
    depends_on: [api]

volumes:
  pgdata:
  minio:
